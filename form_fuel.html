<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>⛽ เติมน้ำมัน · VMS</title>
<!-- LIFF SDK (ยืนยันตัวตนผู้บันทึกจาก LINE จริง) -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --blue:#1565C0; --blue-d:#0D47A1; --bg:#f4f6f8; --line:#e0e4e8; --gray:#8a8a8a; --ok:#2E7D32; --err:#C62828; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI","Sarabun",sans-serif; background:var(--bg); color:#1a1a1a; }
  .head{ background:var(--blue); color:#fff; padding:16px; font-size:18px; font-weight:700; position:sticky; top:0; z-index:5; }
  .wrap{ padding:14px; max-width:520px; margin:0 auto; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:13px; color:#333; font-weight:600; margin:10px 0 5px; }
  label .req{ color:var(--err); }
  input,select{ width:100%; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:#1a1a1a; font-family:inherit; }
  input:focus,select:focus{ outline:none; border-color:var(--blue); }
  .row{ display:flex; gap:10px; }
  .row>div{ flex:1; }
  .datepick{ display:flex; gap:10px; }
  .datepick>div{ flex:1; }
  .datepick>div:first-child{ flex:.6; }
  .datepick>div:nth-child(2){ flex:1.3; }
  .hint{ font-size:12px; color:var(--gray); margin-top:4px; }
  .preview{ background:#eef4fb; border:1px dashed #b9d3ef; border-radius:10px; padding:10px 12px; font-size:14px; color:var(--blue-d); margin-top:10px; display:none; }
  .preview b{ font-size:17px; }
  .photos{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .thumb{ position:relative; width:84px; height:84px; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .thumb .x{ position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6); color:#fff; width:22px; height:22px; border-radius:50%; font-size:14px; line-height:22px; text-align:center; }
  .addph{ width:84px; height:84px; border:1px dashed #b9c2cc; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-direction:column; color:var(--gray); font-size:12px; }
  .addph span{ font-size:26px; line-height:1; }
  .btn{ width:100%; font-size:17px; font-weight:700; padding:15px; border:none; border-radius:12px; background:var(--blue); color:#fff; margin-top:6px; }
  .btn:disabled{ opacity:.55; }
  .seg{ display:flex; gap:8px; margin-top:6px; }
  .seg button{ flex:1; padding:12px 6px; border:1px solid var(--line); background:#fff; border-radius:10px; font-size:14px; color:#444; font-weight:600; }
  .seg button.on{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .linkbtn{ background:none; border:none; color:var(--blue); font-size:13px; font-weight:600; padding:0; margin-top:10px; text-decoration:underline; }
  .hidden{ display:none !important; }
  .who{ font-size:12px; color:var(--gray); text-align:center; margin:2px 0 12px; }
  .msg{ padding:10px 12px; border-radius:10px; font-size:14px; margin-bottom:10px; display:none; }
  .msg.err{ background:#fdecea; color:var(--err); display:block; }
  .loading{ text-align:center; padding:60px 16px; color:var(--gray); }
  .done{ display:none; text-align:center; padding:30px 16px; }
  .done .ic{ font-size:56px; }
  .done h2{ color:var(--ok); margin:10px 0 4px; }
  .sumtab{ text-align:left; background:#fff; border:1px solid var(--line); border-radius:12px; padding:6px 14px; margin:16px auto 0; max-width:360px; }
  .sumtab .r{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid #f0f0f0; font-size:14px; }
  .sumtab .r:last-child{ border-bottom:none; }
  .sumtab .r .k{ color:var(--gray); }
  .btn.ghost{ background:#fff; color:var(--blue); border:1px solid var(--blue); }
</style>
</head>
<body>
  <div class="head">⛽ เติมน้ำมัน</div>

  <!-- ระหว่างยืนยันตัวตน + โหลดข้อมูล -->
  <div class="wrap loading" id="loadView">กำลังยืนยันตัวตนผ่าน LINE…</div>

  <!-- ฟอร์ม -->
  <div class="wrap" id="formView" style="display:none">
    <div class="who" id="who"></div>
    <div class="msg err" id="err"></div>

    <div class="card">
      <label>รถ / เครื่องจักร <span class="req">*</span></label>
      <select id="vehicle"><option value="">— กำลังโหลดรายชื่อ —</option></select>
      <div class="hint" id="odoHint"></div>

      <label>วันที่เติม <span class="req">*</span></label>
      <div class="datepick">
        <div><select id="date_d"></select></div>
        <div><select id="date_m"></select></div>
        <div><select id="date_y"></select></div>
      </div>

      <label>เวลา <span class="req">*</span></label>
      <input type="time" id="time">

      <label>เลขไมล์ / ชม. ปัจจุบัน <span class="req">*</span></label>
      <input type="number" id="odometer" inputmode="decimal" min="0" step="1" placeholder="เลขล่าสุดบนหน้าปัด">
      <div class="hint" id="odoPrev">ใช้คำนวณระยะที่วิ่ง</div>

      <div class="row">
        <div>
          <label>จำนวนลิตร <span class="req">*</span></label>
          <input type="number" id="liters" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
        </div>
        <div>
          <label>ยอดเงินรวม (บาท) <span class="req">*</span></label>
          <input type="number" id="amount" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>

      <div class="preview" id="ppl"></div>

      <label>ประเภทน้ำมัน <span class="req">*</span></label>
      <select id="fuelType">
        <option value="ดีเซล">ดีเซล</option>
        <option value="เบนซิน">เบนซิน</option>
        <option value="แก๊สโซฮอล์ 91">แก๊สโซฮอล์ 91</option>
        <option value="แก๊สโซฮอล์ 95">แก๊สโซฮอล์ 95</option>
      </select>

      <label>ประเภทการจ่าย <span class="req">*</span></label>
      <div class="seg" id="paySeg">
        <button type="button" data-pay="เงินสด">เงินสด</button>
        <button type="button" data-pay="เครดิตปั๊ม">เครดิตปั๊ม</button>
        <button type="button" data-pay="บัตร">บัตร</button>
      </div>

      <div id="cardWrap" class="hidden">
        <label>เลขท้ายบัตร 4 ตัว <span class="req">*</span></label>
        <input type="tel" id="cardLast4" inputmode="numeric" maxlength="4" placeholder="เช่น 1234">
        <div class="hint">กรอกแค่ 4 ตัวท้าย — ไม่เก็บเลขบัตรเต็ม</div>
      </div>

      <button type="button" class="linkbtn" id="acctToggle">แก้รหัสบัญชี</button>
      <div id="acctWrap" class="hidden">
        <label>รหัสบัญชี (อัตโนมัติ แก้ได้)</label>
        <input type="text" id="fuelAccount" placeholder="เลือกรถก่อน">
      </div>
    </div>

    <div class="card">
      <label style="margin-top:0">รูปภาพ (ไม่เกิน 3 รูป)</label>
      <div class="photos" id="photos">
        <label class="addph" id="addph">
          <span>+</span>เพิ่มรูป
          <input type="file" accept="image/*" id="file" style="display:none">
        </label>
      </div>
      <div class="hint">บิลน้ำมัน / หน้าปัดเลขไมล์ ก็ได้</div>
    </div>

    <button class="btn" id="submit">บันทึกการเติมน้ำมัน</button>
  </div>

  <!-- สำเร็จ -->
  <div class="wrap done" id="doneView">
    <div class="ic">✅</div>
    <h2>บันทึกสำเร็จ</h2>
    <div class="who" id="doneNo"></div>
    <div class="sumtab" id="doneSum"></div>
    <button class="btn" id="again" style="margin-top:18px">บันทึกอีกรายการ</button>
    <button class="btn ghost" id="close">ปิดหน้าต่าง</button>
  </div>

<script>
  // ============================================================
  //  ตั้งค่า 2 จุด (ตรงกับ form_maint.html / form_issue.html)
  // ============================================================
  var LIFF_ID = "2011005895-tXtEV8U6";                 // LIFF ID (เปิดเผยได้)
  var API_URL = "https://script.google.com/macros/s/AKfycbx8Bkmrv696FP_dPGo-tKQehfBNm-vkIV0GFZC-3Dn38VH-J3tHfao9cMa20xx8h12z/exec";  // /exec ของ Apps Script
  // ============================================================

  var REPORTER_NAME = "";
  var PHOTOS = [];      // { base64, mimeType, url(preview) }
  var VEHICLES = {};    // id -> option object
  var PAY_TYPE = "";    // ประเภทการจ่าย ที่เลือก

  function $(id){ return document.getElementById(id); }
  function qparam(k){ var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
  function showErr(t){ var e=$('err'); e.textContent=t; e.style.display=t?'block':'none'; if(t) window.scrollTo(0,0); }
  function showLoad(t){ $('loadView').textContent=t; $('loadView').style.display='block'; $('formView').style.display='none'; }

  // เรียก API หลังบ้าน (แนบ access token ทุกครั้ง — หลังบ้านยืนยันตัวตนเอง)
  function apiCall(action, extra){
    var token = liff.getAccessToken();
    if(!token) return Promise.reject(new Error('ไม่พบ token — กรุณาเปิดฟอร์มผ่าน LINE อีกครั้ง'));
    var body = { action: action, accessToken: token };
    if(extra){ for(var k in extra) body[k]=extra[k]; }
    // XMLHttpRequest แทน fetch — เบราว์เซอร์ในแอป LINE (iOS) ตาม redirect 302 ผ่าน fetch ไม่ได้
    return new Promise(function(resolve, reject){
      try{
        var xhr = new XMLHttpRequest();
        xhr.open('POST', API_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8'); // simple request → เลี่ยง CORS preflight
        xhr.onload = function(){
          try{ resolve(JSON.parse(xhr.responseText)); }
          catch(e){ reject(new Error('อ่านผลลัพธ์หลังบ้านไม่ได้: ' + String(xhr.responseText).slice(0,120))); }
        };
        xhr.onerror = function(){ reject(new Error('เชื่อมต่อหลังบ้านไม่ได้ (network/CORS)')); };
        xhr.ontimeout = function(){ reject(new Error('หลังบ้านตอบช้าเกินไป (timeout)')); };
        xhr.timeout = 25000;
        xhr.send(JSON.stringify(body));
      }catch(e){ reject(e); }
    });
  }

  /* ---------- โหลดรายชื่อรถ ---------- */
  function fillVehicles(list){
    var sel=$('vehicle'); sel.innerHTML='<option value="">— เลือกรถ —</option>';
    (list||[]).forEach(function(v){
      VEHICLES[v.id]=v;
      var o=document.createElement('option'); o.value=v.id; o.textContent=v.label; sel.appendChild(o);
    });
  }
  function onVehicle(){
    var v=VEHICLES[$('vehicle').value];
    if(!v){ $('odoHint').textContent=''; $('fuelAccount').value=''; $('odoPrev').textContent='ใช้คำนวณระยะที่วิ่ง'; return; }
    $('fuelAccount').value=v.fuelAccount||'';
    var unit=v.unit||'กม.';
    $('odometer').placeholder='เลข'+unit+'ปัจจุบัน';
    $('odoHint').textContent = (v.odo!==''&&v.odo!=null) ? ('ล่าสุดในระบบ: '+Number(v.odo).toLocaleString('th-TH')+' '+unit) : 'ยังไม่มีเลขล่าสุดในระบบ';
    $('odoPrev').textContent = (v.odo!==''&&v.odo!=null) ? ('ครั้งก่อน: '+Number(v.odo).toLocaleString('th-TH')+' '+unit) : 'ยังไม่มีเลขครั้งก่อนในระบบ';
  }

  /* ---------- ประเภทการจ่าย ---------- */
  function onPay(ev){
    var btn=ev.target.closest('button[data-pay]'); if(!btn) return;
    PAY_TYPE=btn.getAttribute('data-pay');
    $('paySeg').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b===btn); });
    var isCard = (PAY_TYPE==='บัตร');
    $('cardWrap').classList.toggle('hidden', !isCard);
    if(!isCard) $('cardLast4').value='';
  }
  function toggleAcct(){ $('acctWrap').classList.toggle('hidden'); }

  /* ---------- ราคา/ลิตร live ---------- */
  function calcPPL(){
    var L=parseFloat($('liters').value), A=parseFloat($('amount').value), box=$('ppl');
    if(L>0 && A>0){ box.style.display='block'; box.innerHTML='ราคาเฉลี่ย <b>'+(A/L).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})+'</b> บาท/ลิตร'; }
    else box.style.display='none';
  }

  /* ---------- รูป: ย่อ ~1280px แล้วเก็บ base64 ---------- */
  function onFile(ev){
    var f=ev.target.files[0]; ev.target.value='';
    if(!f) return;
    if(PHOTOS.length>=3){ showErr('แนบได้ไม่เกิน 3 รูป'); return; }
    var img=new Image(), rd=new FileReader();
    rd.onload=function(){ img.onload=function(){
      var max=1280, w=img.width, h=img.height;
      if(w>max||h>max){ if(w>h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      var url=c.toDataURL('image/jpeg',0.8);
      PHOTOS.push({ base64:url.split(',')[1], mimeType:'image/jpeg', url:url });
      renderPhotos();
    }; img.src=rd.result; };
    rd.readAsDataURL(f);
  }
  function renderPhotos(){
    var box=$('photos');
    box.querySelectorAll('.thumb').forEach(function(n){ n.remove(); });
    PHOTOS.forEach(function(p,i){
      var d=document.createElement('div'); d.className='thumb';
      d.innerHTML='<img src="'+p.url+'"><div class="x" data-i="'+i+'">×</div>';
      box.insertBefore(d,$('addph'));
    });
    $('addph').style.display = PHOTOS.length>=3 ? 'none':'flex';
    box.querySelectorAll('.x').forEach(function(x){ x.onclick=function(){ PHOTOS.splice(+x.getAttribute('data-i'),1); renderPhotos(); }; });
  }

  /* ---------- ตัวเลือกวันที่แบบไทย (วัน / เดือนไทย / ปี พ.ศ.) ---------- */
  var THAI_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  function initDatePick(prefix){
    var d=$(prefix+'_d'), m=$(prefix+'_m'), y=$(prefix+'_y');
    d.innerHTML='<option value="">วัน</option>';
    for(var i=1;i<=31;i++){ var o=document.createElement('option'); o.value=i; o.textContent=i; d.appendChild(o); }
    m.innerHTML='<option value="">เดือน</option>';
    THAI_MONTHS.forEach(function(name,idx){ var o=document.createElement('option'); o.value=idx+1; o.textContent=name; m.appendChild(o); });
    y.innerHTML='<option value="">ปี พ.ศ.</option>';
    var beNow=new Date().getFullYear()+543;
    for(var yy=beNow-1; yy<=beNow+1; yy++){ var o=document.createElement('option'); o.value=yy; o.textContent=yy; y.appendChild(o); }
  }
  function pickIso(prefix){
    var d=$(prefix+'_d').value, m=$(prefix+'_m').value, y=$(prefix+'_y').value;
    if(!d || !m || !y) return '';
    return (Number(y)-543)+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2);
  }
  function setPickIso(prefix, iso){
    if(!iso){ $(prefix+'_d').value=''; $(prefix+'_m').value=''; $(prefix+'_y').value=''; return; }
    var p=String(iso).slice(0,10).split('-');
    $(prefix+'_y').value=Number(p[0])+543;
    $(prefix+'_m').value=Number(p[1]);
    $(prefix+'_d').value=Number(p[2]);
  }

  /* ---------- ส่ง ---------- */
  function submit(){
    showErr('');
    var vId=$('vehicle').value, L=$('liters').value, A=$('amount').value, O=$('odometer').value;
    var C4=$('cardLast4').value.replace(/\D/g,'');
    var dateIso=pickIso('date');
    if(!vId){ showErr('กรุณาเลือกรถ'); return; }
    if(!dateIso){ showErr('กรุณาเลือกวันที่'); return; }
    if(!$('time').value){ showErr('กรุณาเลือกเวลา'); return; }
    if(!(parseFloat(O)>=0) || O===''){ showErr('กรุณากรอกเลขไมล์ / ชม. ปัจจุบัน'); return; }
    if(!(parseFloat(L)>0)){ showErr('กรุณากรอกจำนวนลิตร'); return; }
    if(!(parseFloat(A)>0)){ showErr('กรุณากรอกยอดเงิน'); return; }
    if(!PAY_TYPE){ showErr('กรุณาเลือกประเภทการจ่าย'); return; }
    if(PAY_TYPE==='บัตร' && C4.length!==4){ showErr('กรุณากรอกเลขท้ายบัตร 4 ตัว'); return; }

    var data={
      vehicleId: vId,
      dateIso: dateIso,
      timeStr: $('time').value,
      fuelType: $('fuelType').value,
      liters: L,
      amount: A,
      odometer: O,
      unit: (VEHICLES[vId] && VEHICLES[vId].unit) || 'กม.',
      payType: PAY_TYPE,
      cardLast4: (PAY_TYPE==='บัตร') ? C4 : '',
      fuelAccount: $('fuelAccount').value
    };
    var photos = PHOTOS.map(function(p){ return { base64:p.base64, mimeType:p.mimeType }; });

    var b=$('submit'); b.disabled=true; b.textContent='กำลังบันทึก…';
    apiCall('submitFuel', { data:data, photos:photos })
      .then(function(res){
        if(!res || !res.ok){ throw new Error((res&&res.message) || 'บันทึกไม่สำเร็จ'); }
        onDone(res.result||{});
      })
      .catch(function(e){
        b.disabled=false; b.textContent='บันทึกการเติมน้ำมัน';
        showErr('บันทึกไม่สำเร็จ: '+e.message);
      });
  }

  function onDone(res){
    res=res||{};
    $('formView').style.display='none';
    $('doneView').style.display='block';
    $('doneNo').textContent='เลขบันทึก: '+(res.logId||'-');
    var rate = (res.rate!==''&&res.rate!=null) ? (Number(res.rate).toLocaleString('th-TH',{maximumFractionDigits:2})+' กม./ลิตร') : '-';
    var pay = res.payType ? (res.payType + (res.cardLast4 ? ' ••'+String(res.cardLast4).replace(/\D/g,'').slice(-4) : '')) : '-';
    var rows=[
      ['ราคา/ลิตร', (res.pricePerL!==''&&res.pricePerL!=null)? Number(res.pricePerL).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})+' บาท':'-'],
      ['ระยะที่วิ่ง', (res.distance!==''&&res.distance!=null)? Number(res.distance).toLocaleString('th-TH')+' กม.':'-'],
      ['อัตราสิ้นเปลือง', rate],
      ['จ่ายโดย', pay],
      ['รหัสบัญชี', res.fuelAccount||'-']
    ];
    $('doneSum').innerHTML=rows.map(function(r){ return '<div class="r"><span class="k">'+r[0]+'</span><span>'+r[1]+'</span></div>'; }).join('');
    window.scrollTo(0,0);
  }

  function resetForm(){
    PHOTOS=[]; renderPhotos();
    ['liters','amount','odometer','cardLast4'].forEach(function(id){ $(id).value=''; });
    PAY_TYPE=''; $('paySeg').querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });
    $('cardWrap').classList.add('hidden'); $('acctWrap').classList.add('hidden');
    $('ppl').style.display='none';
    setNow();
    $('doneView').style.display='none'; $('formView').style.display='block';
    var b=$('submit'); b.disabled=false; b.textContent='บันทึกการเติมน้ำมัน';
    window.scrollTo(0,0);
  }

  function setNow(){
    var n=new Date();
    var iso=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);
    setPickIso('date', iso);   // ค่าเริ่มต้น = วันที่บันทึก (วันนี้)
    $('time').value=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);
  }

  function closeWindow(){
    if(liff.isInClient()){ liff.closeWindow(); }
    else { resetForm(); }
  }

  function bindEvents(){
    $('vehicle').onchange=onVehicle;
    $('liters').oninput=calcPPL; $('amount').oninput=calcPPL;
    $('paySeg').onclick=onPay;
    $('acctToggle').onclick=toggleAcct;
    $('cardLast4').oninput=function(){ this.value=this.value.replace(/\D/g,'').slice(0,4); };
    $('file').onchange=onFile;
    $('submit').onclick=submit;
    $('again').onclick=resetForm;
    $('close').onclick=closeWindow;
  }

  // ── เริ่มระบบ: LIFF init → ยืนยันตัวตน → โหลดชื่อ + รายชื่อรถ ──
  function startApp(){
    var stage='init';
    liff.init({ liffId: LIFF_ID })
      .then(function(){
        stage='login';
        if(!liff.isLoggedIn()){ liff.login(); return; }
        showLoad('กำลังโหลดข้อมูล…');
        stage='getBootstrap';
        return apiCall('getBootstrap', null).then(function(res){
          if(!res || !res.ok){ throw new Error((res&&res.message) || 'ยืนยันตัวตนไม่สำเร็จ'); }
          REPORTER_NAME = res.name || '(ไม่พบชื่อ)';
          $('who').textContent = 'ผู้บันทึก: ' + REPORTER_NAME;
          fillVehicles(res.vehicles);
          $('loadView').style.display='none';
          $('formView').style.display='block';
        });
      })
      .catch(function(e){
        showLoad('เกิดข้อผิดพลาด ['+stage+']: ' + (e && e.message ? e.message : e) + '\nกรุณาแคปหน้านี้ส่งแอดมิน');
      });
  }

  window.onload=function(){
    initDatePick('date');
    setNow();   // ค่าเริ่มต้น = วันเวลาปัจจุบัน
    bindEvents();
    startApp();
  };
</script>
</body>
</html>
