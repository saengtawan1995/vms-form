<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VMS · กำลังเปิดฟอร์ม…</title>
<style>
  body{ margin:0; font-family:-apple-system,"Segoe UI","Sarabun",sans-serif; background:#f4f6f8; color:#555;
        display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .box{ text-align:center; padding:24px; }
  .sp{ width:34px; height:34px; border:3px solid #d9dee4; border-top-color:#3D7EDB; border-radius:50%;
       margin:0 auto 14px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  a{ color:#3D7EDB; }
</style>
</head>
<body>
  <div class="box">
    <div class="sp"></div>
    <div id="msg">กำลังเปิดฟอร์ม…</div>
  </div>
<script>
  // ============================================================
  //  Router — LIFF endpoint ชี้มาที่ไฟล์นี้ (index.html)
  //  อ่าน ?page= แล้วพาไปฟอร์มที่ถูกต้อง โดยคง query อื่น (เช่น issue) ไว้
  //  ปุ่มบน Rich Menu / การ์ด LINE เปิด liff.line.me/<id>?page=<page>&issue=<id>
  //  LINE จะต่อ query ให้ index.html เห็น (บางเครื่องห่อใน liff.state)
  // ============================================================
  var PAGES = {                 // page → ไฟล์ฟอร์ม (whitelist กันพาไปหน้ามั่ว)
    issue:     'form_issue.html',
    maint:     'form_maint.html',
    fuel:      'form_fuel.html',
    breakdown: 'form_breakdown.html',
    tax:       'form_tax.html',
    register:  'form_register.html'
  };
  var DEFAULT_PAGE = 'issue';   // ไม่ระบุ page → ฟอร์มแจ้งซ่อม

  // whitelist ชื่อไฟล์ฟอร์ม — กัน redirect ไปไฟล์มั่ว
  var FILES = {};
  for (var _k in PAGES) FILES[PAGES[_k]] = true;

  function dec_(v){ try{ return decodeURIComponent(v); }catch(e){ return v; } }

  // แปลง query string → object (ไม่ทับค่าที่มาก่อน)
  function parseQS_(qs){
    var out = {};
    if(!qs) return out;
    if(qs.charAt(0)==='?') qs = qs.slice(1);
    qs.split('&').forEach(function(pair){
      if(!pair) return;
      var i = pair.indexOf('=');
      var k = i<0 ? pair : pair.slice(0,i);
      var v = i<0 ? ''   : pair.slice(i+1);
      k = dec_(k); v = dec_(v);
      if(k && out[k]==null) out[k]=v;
    });
    return out;
  }

  function redirect_(url){
    document.getElementById('msg').textContent = 'กำลังเปิดฟอร์ม…';
    location.replace(url);     // replace = ไม่ค้างใน history (กดย้อนกลับไม่วนมา router)
  }

  function go(){
    var top = parseQS_(location.search);

    // ── LINE ห่อ query/พาธเดิมไว้ใน liff.state ──
    var state = top['liff.state'];
    if(state){
      var s = dec_(state);
      // (A) liff.state ชี้ตรงไปที่ไฟล์ฟอร์ม เช่น "/form_maint.html?issue=xxx"
      //     เกิดหลัง LIFF วิ่ง OAuth เสร็จแล้วเด้งกลับมาที่ router → พาไปไฟล์นั้นตรง ๆ
      var m = s.match(/([A-Za-z0-9_]+\.html)(\?[^#]*)?/);
      if(m && FILES[m[1]]){
        redirect_(m[1] + (m[2] || ''));
        return;
      }
      // (B) liff.state เป็น query "?page=maint&issue=xxx" — รวมเข้ากับ top
      var sp = parseQS_(s.charAt(0)==='?' ? s : ('?'+s));
      for(var k in sp){ if(top[k]==null) top[k]=sp[k]; }
    }
    delete top['liff.state'];

    var page = top['page'] || DEFAULT_PAGE;
    var file = PAGES[page] || PAGES[DEFAULT_PAGE];

    // คงทุก param ยกเว้น page (ไม่ต้องใช้แล้ว)
    var parts = [];
    for(var k2 in top){
      if(k2==='page') continue;
      parts.push(encodeURIComponent(k2)+'='+encodeURIComponent(top[k2]));
    }
    redirect_(file + (parts.length ? ('?'+parts.join('&')) : ''));
  }

  go();
</script>
</body>
</html>
